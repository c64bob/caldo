name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.865

      - name: Install tailwindcss
        env:
          TAILWIND_VERSION: v3.4.17
          TAILWIND_SHA256: 7d24f7fa191d2193b78cd5f5a42a6093e14409521908529f42d80b11fde1f1d4
        run: |
          curl -sSL "https://github.com/tailwindlabs/tailwindcss/releases/download/${TAILWIND_VERSION}/tailwindcss-linux-x64" -o /usr/local/bin/tailwindcss
          echo "${TAILWIND_SHA256}  /usr/local/bin/tailwindcss" | sha256sum -c -
          chmod +x /usr/local/bin/tailwindcss

      - name: Go vet
        run: go vet ./...

      - name: Go test with race detector
        run: go test ./... -race

      - name: Generate templ files
        run: templ generate

      - name: Check generated templ diff
        run: git diff --exit-code

      - name: Build static asset manifest
        run: make assets

      - name: Check static asset diff
        run: git diff --exit-code

      - name: Build Caldo binary
        run: make build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build Docker image
        run: docker build -t caldo:ci .
